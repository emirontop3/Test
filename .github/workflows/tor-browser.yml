name: Tor Browser Workflow

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  run-browser-over-tor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tor and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tor

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Start Tor
        run: |
          sudo systemctl start tor || sudo service tor start
          sleep 8

      - name: Run browser script
        run: python app.py

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-browser-screenshot
          path: artifacts/tor-check.png
